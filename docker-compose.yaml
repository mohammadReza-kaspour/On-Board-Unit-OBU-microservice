services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-broker
    hostname: kafka-broker
    ports:
      - "9092:9092"   # INTERNAL listener (for other Docker containers)
      - "9093:9093"   # EXTERNAL listener (for your Windows host / local machine)
    environment:
      # --- KRaft Mode Configuration ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # --- Listener Configuration (Dual Listeners) ---
      # INTERNAL: used by other Docker containers on the same network
      # EXTERNAL: used by clients on your host machine (Windows)
      # CONTROLLER: used internally for KRaft controller quorum
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094'

      # Advertised addresses returned to clients:
      # - Containers on the same Docker network use kafka-broker:9092
      # - Your host machine uses localhost:9093
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-broker:9092,EXTERNAL://localhost:9093'

      # Map listener names to security protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'

      # Brokers and controllers communicate via the INTERNAL listener
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'

      # --- Replication Factor Settings (for Single Node) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1